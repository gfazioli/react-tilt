<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0a0a0b"/>
      <stop offset="1" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="card" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.5" stop-color="#ec4899"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="glare" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="text" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="0.5" stop-color="#f0abfc"/>
      <stop offset="1" stop-color="#fdba74"/>
    </linearGradient>
    <radialGradient id="glow-top" cx="30%" cy="20%" r="55%">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-bottom" cx="75%" cy="85%" r="55%">
      <stop offset="0" stop-color="#f97316" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="32"/>
      <feOffset dx="0" dy="22"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="360" cy="120" rx="520" ry="280" fill="url(#glow-top)"/>
  <ellipse cx="900" cy="540" rx="520" ry="260" fill="url(#glow-bottom)"/>

  <!-- Tilted card mark — perspective-faked 3D rotation -->
  <g transform="translate(440 110)" filter="url(#shadow)">
    <g transform="matrix(0.94 -0.22 0.18 0.93 0 30)">
      <rect x="-40" y="-20" width="400" height="240" rx="22" fill="url(#card)"/>
      <rect x="-40" y="-20" width="400" height="240" rx="22" fill="url(#glare)"/>
    </g>
  </g>

  <text
    x="600"
    y="450"
    text-anchor="middle"
    font-family="Inter, -apple-system, sans-serif"
    font-size="64"
    font-weight="800"
    fill="white"
    letter-spacing="-2"
  >@gfazioli/react-tilt</text>

  <text
    x="600"
    y="510"
    text-anchor="middle"
    font-family="Inter, -apple-system, sans-serif"
    font-size="26"
    font-weight="500"
    fill="#a1a1aa"
    letter-spacing="-0.5"
  >3D tilt cards · parallax · glare · spring physics · Zero deps</text>

  <text
    x="600"
    y="575"
    text-anchor="middle"
    font-family="JetBrains Mono, ui-monospace, monospace"
    font-size="22"
    font-weight="600"
    fill="url(#text)"
    letter-spacing="2"
  >v1 · React 18 &amp; 19</text>
</svg>
